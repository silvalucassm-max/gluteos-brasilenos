<body class="vsl">
<main class="vsl__inner">

  <!-- ================= CABECERA ================= -->
  <header class="vhero">
    <p class="vhero__badge">
      <span class="vhero__dot" aria-hidden="true"></span>
      <span>🎯 Acceso exclusivo confirmado</span>
    </p>

    <h1 class="vhero__title">¡Fuiste<span>seleccionada!</span></h1>

    <div class="vhero__rule" aria-hidden="true"></div>

    <p class="vhero__sub">
      Tu video ya comenzó. <b>Míralo</b> y desbloquea el protocolo.
    </p>
  </header>

  <!-- ================= VSL · VTurb SmartPlayer =================
       El botón del pitch (11:12) está configurado dentro del panel
       de VTurb y apunta a oferta.html. No hay ningún botón en HTML
       en esta página a propósito: dos CTA compiten entre sí.

       Para cambiar de video: reemplaza el id del elemento y la URL
       del script por los que te da el panel. Nada más.
       ============================================================ -->
  <div class="vsl__frame">
    <vturb-smartplayer
      id="vid-6a873810d9f6416c27249910"
      style="display:block;margin:0 auto;width:100%;max-width:400px;">
      <div class="vturb-player-placeholder"
           style="position:relative;width:100%;padding:125% 0 0;z-index:0;background-color:black;"></div>
    </vturb-smartplayer>
  </div>

  <script type="text/javascript">
    var s = document.createElement("script");
    s.src = "https://scripts.converteai.net/24075d57-aa03-4943-baea-ec47ff4b00c2/players/6a873810d9f6416c27249910/v4/player.js";
    s.async = !0;
    document.head.appendChild(s);
  </script>

</main>

<script src="js/funnel.js"></script>
<script>
(function () {
  'use strict';

  /* funnel.js ya corre solo al cargar:
     · guarda los UTM que vengan en la URL
     · los deja en sessionStorage para que oferta.html los use

     Acá solo marcamos que la lead llegó a ver la VSL. Sirve para
     armar el público de retargeting de "vio el video y no compró".
     El InitiateCheckout va en oferta.html, no acá. */
  Funnel.track('ViewContent', { content_name: 'vsl' });
})();
</script>
